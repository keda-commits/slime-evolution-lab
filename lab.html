<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形態比較ラボ</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow: auto; }
  #labTop { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #labTop input { width: 90px; font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  #labTop .active { background: var(--accent); color: #111; }
  #labWrap { position: relative; height: calc(100vh - 50px); }
  #labCanvas { width: 100%; height: 100%; display: block; }
  .cellHud { position: absolute; background: rgba(0,0,0,0.65); border-radius: 6px; padding: 4px 8px; font-size: 12px; line-height: 1.45; pointer-events: auto; }
  .cellHud select { font-size: 12px; }
</style>
</head>
<body>
<div id="labTop">
  <b>形態比較ラボ</b>
  <span class="muted">同じシード・同じ環境で4形態を同時に動かして比較</span>
  <label class="small">シード <input id="seed" type="number" value="42"></label>
  <button id="restart">リスタート</button>
  <button class="spd active" data-spd="1">1x</button><button class="spd" data-spd="2">2x</button><button class="spd" data-spd="4">4x</button>
  <button id="pause">⏸</button>
  <a href="./" style="color:#9bf6ff;margin-left:auto">← ゲームへ戻る</a>
</div>
<div id="labWrap"><canvas id="labCanvas"></canvas></div>
<script type="module" src="js/lab.js"></script>
</body>
</html>
