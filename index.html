<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライム進化ラボ</title>
<meta name="description" content="ガチャで能力因子を引き、スライムの進化を選び、自動で狩りをする姿を観察するブラウザゲームの試作。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='40' rx='26' ry='20' fill='%23ff7a1a'/><circle cx='24' cy='36' r='4' fill='white'/><circle cx='40' cy='36' r='4' fill='white'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="fieldWrap">
    <canvas id="field"></canvas>
    <div id="topbar">
      <div class="mana"><span class="mana-icon">✦</span><span id="manaVal">0</span><span class="mana-label">魔素</span><span id="manaRate" class="rate"></span></div>
      <div class="ctrl">
        <button id="btnPause" title="一時停止 (Space)">⏸</button>
        <button class="spd active" data-spd="1">1x</button>
        <button class="spd" data-spd="2">2x</button>
        <button class="spd" data-spd="4">4x</button>
        <button id="btnFollow" title="選択中の血統をズームで追いかける (F)">📷 追従</button>
        <button id="btnLinks" title="狙っている獲物への線を表示">🎯</button>
        <button id="btnMenu" title="メニュー">⚙</button>
      </div>
    </div>
    <div id="menu" class="hidden">
      <button id="btnLab">🔬 形態比較ラボ（別タブ）</button>
      <button id="btnHelp">❓ 遊び方</button>
      <button id="btnReset" class="danger">🗑 セーブ初期化</button>
      <div class="menu-note">セーブはブラウザに自動保存されます</div>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="feed"></div>
    <div id="tip" class="hidden"></div>
    <div id="pausedBadge" class="hidden">一時停止中</div>
  </div>
  <aside id="panel">
    <nav id="tabs">
      <button data-tab="gacha" class="active">ガチャ</button>
      <button data-tab="evo">進化<span id="evoBadge" class="badge hidden">!</span></button>
      <button data-tab="lin">血統</button>
    </nav>
    <div id="tabBody"></div>
  </aside>
</div>

<div id="gachaOverlay" class="overlay hidden">
  <div class="gacha-box">
    <div id="gachaTitle"></div>
    <div id="gachaCards"></div>
    <div id="gachaNews"></div>
    <div class="gacha-actions">
      <button id="gachaSkip">スキップ ▶▶</button>
      <button id="gachaAgain" class="hidden"></button>
      <button id="gachaClose" class="hidden">閉じる</button>
    </div>
  </div>
</div>

<div id="intro" class="overlay">
  <div class="intro-box">
    <h1>スライム進化ラボ</h1>
    <p class="lead">ガチャで<b>能力因子</b>を引き、スライムの<b>進化</b>を選ぶ。<br>あとはスライムが勝手に狩りをする。その姿を観察しよう。</p>
    <ol>
      <li><b>ガチャ</b>：初回10連は無料。因子を集める。</li>
      <li><b>進化</b>：「炎」＋行動因子で形態が決まる。進化すると動き方・狙う獲物・狩り方が変わる。</li>
      <li><b>観察</b>：スライムは自動で探索・捕食し、<b>魔素</b>を稼ぐ。魔素で次のガチャへ。</li>
      <li><b>血統</b>：別の血統を分岐させ、違う進化系統を同時に育てられる。</li>
    </ol>
    <p class="small">スライムは直接操作できません。クリックで血統を選択、ホイールでズーム、ドラッグで移動。Spaceで一時停止。</p>
    <div class="intro-actions">
      <button id="btnStart" class="primary">はじめる</button>
    </div>
  </div>
</div>

<div id="confirm" class="overlay hidden">
  <div class="intro-box small-box">
    <p id="confirmMsg"></p>
    <div class="intro-actions"><button id="confirmNo">キャンセル</button><button id="confirmYes" class="danger">実行</button></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
